cam1_blur_ksize: 5
cam1_edge_crop: 0
cam1_bg_ksize: 201
cam1_diff_threshold: 0.5
# PatchCore：每块正方形热力图边缘抑制
#   soft_border：过渡带宽（像素），0 表示不按带宽做边缘抑制
#   strength：抑制强度 0~1，0=完全不抑制，1=最外缘一行/列热力乘权为 0（向内恢复）
#   weight_profile：过渡曲线。linear=线性 ramp；ease_out_cubic=默认，w=1-(1-t)^3，靠外缘变化快、
#     靠内缘趋近 1 更缓，减轻后续 H_diff 在「抑制带末端」的伪高亮
cam1_patchcore_edge_soft_border: 50
cam1_patchcore_edge_strength: 0.5
cam1_patchcore_edge_weight_profile: ease_out_cubic
cam1_standard_ratio_x: 0.4308
cam1_times: 0.865127
